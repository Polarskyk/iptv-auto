name: Release
permissions:
  contents: write
  packages: write
on:
  workflow_dispatch:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install native build dependencies for pip packages
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies with pipenv
        run: pipenv --python 3.13 && pipenv install --dev

      - name: Build the application
        run: pipenv run pyinstaller tkinter_ui/tkinter_ui.spec

      - name: List dist directory contents
        run: dir dist

      - name: Get info from version.json
        id: get_info
        run: |
          $json = Get-Content version.json | ConvertFrom-Json
          echo "version=$($json.version)" >> $env:GITHUB_ENV
          echo "name=$($json.name)" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Compress dist directory
        run: |
          Compress-Archive -Path dist\* -DestinationPath dist\${{ env.name }}-v${{ env.version }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}-v${{ env.version }}
          path: dist\${{ env.name }}-v${{ env.version }}.zip

      - name: Get changelog
        id: get_changelog
        run: |
          $version = "${{ env.version }}"
          $changelog = (Get-Content CHANGELOG.md -Raw)
          $changelog = [regex]::Match($changelog, "(?s)## v$version.*?(?=## v)").Value
          $changelog = $changelog -replace "(?s)^## v$version.*?\n", ""
          $changelog = $changelog.Trim()
          Set-Content -Path release-notes.md -Value $changelog -Encoding utf8
          "RELEASE_NOTES_FILE=$((Resolve-Path release-notes.md).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = "${{ env.version }}"
          $releaseName = "v${{ env.version }}"
          $assetPath = "dist/${{ env.name }}-v${{ env.version }}.zip"

          gh release view $tagName --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tagName --title $releaseName --notes-file $env:RELEASE_NOTES_FILE
            gh release upload $tagName $assetPath --clobber
          } else {
            gh release create $tagName $assetPath --title $releaseName --notes-file $env:RELEASE_NOTES_FILE
          }

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from version.json
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/polarskyk/iptv-auto:latest
            ghcr.io/polarskyk/iptv-auto:${{ env.version }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
